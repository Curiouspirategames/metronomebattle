<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Metronome Battle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --bg:#0d0a0f; --surface:#17111a; --surface2:#211724; --border:#3a2530;
  --p1:#fb923c; --p1-dim:rgba(251,146,60,.15);
  --p2:#dc2626; --p2-dim:rgba(220,38,38,.15);
  --gold:#fbbf24; --green:#34d399; --text:#f1e6ea; --muted:#8a7480;
  --glow-p1:rgba(251,146,60,.35); --glow-p2:rgba(220,38,38,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif;overflow-x:hidden}
body{background-image:radial-gradient(ellipse 60% 35% at 15% 0%,rgba(251,146,60,.10) 0%,transparent 65%),radial-gradient(ellipse 60% 35% at 85% 0%,rgba(220,38,38,.10) 0%,transparent 65%);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:var(--gold);color:#1a1116}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.screen{display:none;min-height:100vh;padding:20px 16px 48px;flex-direction:column;align-items:center}
.screen.active{display:flex}
.wrap{width:100%;max-width:560px}

.page-title{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(1.9rem,7vw,2.7rem);letter-spacing:.1em;text-align:center;background:linear-gradient(120deg,var(--p1) 0%,var(--gold) 45%,var(--p2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(251,146,60,.25));margin-bottom:2px}
.vs-divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0 18px}
.vs-divider .line{height:1px;width:40px;background:linear-gradient(90deg,transparent,var(--border))}
.vs-divider .line.r{background:linear-gradient(90deg,var(--border),transparent)}
.vs-divider .x{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.3em;color:var(--muted)}
.page-subtitle{font-style:italic;color:var(--muted);text-align:center;font-size:1.02rem;margin-bottom:24px;line-height:1.5}

.mode-grid{display:grid;grid-template-columns:1fr;gap:12px;width:100%}
.mode-card{background:linear-gradient(150deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:14px;padding:16px 18px;text-align:left;position:relative;overflow:hidden;transition:border-color .2s,transform .15s}
.mode-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--p1),var(--p2))}
.mode-card:active{transform:scale(.98)}
.mode-card .m-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:.03em;margin-bottom:4px}
.mode-card .m-desc{font-size:.94rem;color:var(--muted);line-height:1.4}
.mode-card .m-tag{display:inline-block;margin-top:8px;font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);padding:2px 8px;border-radius:20px}

.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:18px}
.role-card{border-radius:14px;padding:22px 14px;text-align:center;border:1px solid var(--border)}
.role-card.p1{background:linear-gradient(150deg,var(--p1-dim),transparent);border-color:rgba(251,146,60,.35)}
.role-card.p2{background:linear-gradient(150deg,var(--p2-dim),transparent);border-color:rgba(220,38,38,.35)}
.role-card .r-icon{font-size:1.8rem;margin-bottom:6px}
.role-card .r-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:4px}
.role-card.p1 .r-title{color:var(--p1)}
.role-card.p2 .r-title{color:var(--p2)}
.role-card .r-desc{font-size:.85rem;color:var(--muted);line-height:1.35}

.field{width:100%;margin-bottom:16px}
.field label{display:block;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:1.05rem;font-family:'Rajdhani',sans-serif}
.field input[type=text]:focus{outline:none;border-color:var(--p1)}
.field input.p2-focus:focus{border-color:var(--p2)}

.slider-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slider-row .s-label{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.9rem}
.slider-row .s-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.95rem;color:var(--gold)}
input[type=range]{width:100%;height:6px;border-radius:4px;background:var(--surface2);-webkit-appearance:none;margin-bottom:16px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--gold));box-shadow:0 0 10px var(--glow-p1)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--p1),var(--gold))}

/* pattern style picker */
.pill-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{padding:9px 15px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
  font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.95rem;color:var(--muted);
  transition:all .15s;line-height:1;white-space:nowrap}
.pill:active{transform:scale(.96)}
.pill.active{background:linear-gradient(135deg,rgba(251,146,60,.22),rgba(220,38,38,.22));
  border-color:var(--gold);color:var(--gold)}
/* "you've beaten them" banner */
/* live shaping meter for Set the Trap */
/* break panel */
/* countdown strip — sits above the radar so the metronome stays visible */
.cd-strip{width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:14px;
  border:1px solid rgba(251,191,36,.4);border-radius:14px;
  background:linear-gradient(135deg,rgba(251,191,36,.10),transparent)}
.cd-strip.hold{border-color:var(--p2);background:linear-gradient(135deg,rgba(220,38,38,.16),transparent);
  animation:holdPulse 1.4s ease-in-out infinite}
@keyframes holdPulse{0%,100%{border-color:rgba(220,38,38,.5)}50%{border-color:rgba(220,38,38,1)}}
.cd-mini{flex:0 0 auto;transform:rotate(-90deg)}
.cd-side{display:flex;flex-direction:column;gap:2px;min-width:0}
.cd-strip .cd-num{position:static;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:2rem;
  line-height:1;color:var(--gold)}
.cd-cap{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.85rem;color:var(--muted);line-height:1.3}
.hold-note{width:100%;text-align:center;font-style:italic;color:var(--p2);font-size:.95rem;margin-bottom:14px}
.break-panel{width:100%;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(150deg,rgba(52,211,153,.10),transparent);
  border:1px solid rgba(52,211,153,.35);border-radius:14px;padding:26px 18px;margin:18px 0 22px}
.bp-lab{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--green);margin-bottom:8px}
.bp-num{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3.2rem;color:var(--text);line-height:1}
.bp-note{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:8px;text-align:center}
.bp-inline{width:100%;text-align:center;font-family:'Rajdhani',sans-serif;font-weight:600;
  color:var(--green);font-size:.95rem;margin-bottom:10px}
.bias-meter{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
.bm-scale{display:flex;gap:6px;align-items:center}
.bm-pip{width:26px;height:8px;border-radius:4px;background:var(--surface2);
  border:1px solid var(--border);transition:all .18s}
.bm-pip.z{width:10px;border-radius:50%;height:10px}
.bm-pip.on.p{background:var(--p2);border-color:var(--p2);box-shadow:0 0 12px var(--glow-p2)}
.bm-pip.on.n{background:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(52,211,153,.5)}
.bm-pip.on.z{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(251,191,36,.5)}
.bm-lab{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.bias-meter.up .bm-lab{color:var(--p2)}
.bias-meter.down .bm-lab{color:var(--green)}
.ahead-banner{width:100%;background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(251,191,36,.10));
  border:1px solid rgba(52,211,153,.45);border-radius:12px;padding:14px 16px;margin-bottom:16px;text-align:center}
.ahead-banner.clear{background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,146,60,.12));
  border-color:var(--gold)}
.ahead-banner .ab-txt{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:1rem;
  color:var(--green);line-height:1.4}
.ahead-banner.clear .ab-txt{color:var(--gold)}
.btn{width:100%;padding:15px;border-radius:12px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-align:center;margin-bottom:10px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 4px 20px var(--glow-p2)}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-sm{padding:10px;font-size:.95rem}
.back-link{align-self:flex-start;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.92rem;margin-bottom:14px}

.code-box{width:100%;background:var(--surface);border:1px dashed var(--gold);border-radius:12px;padding:18px;text-align:center;margin-bottom:12px}
.code-box .c-label{font-family:'Rajdhani',sans-serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.code-box .c-value{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.06em;color:var(--gold);word-break:break-all;line-height:1.45;user-select:all;-webkit-user-select:all}

.duel-header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.duel-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.05rem}
.duel-name.side-p1{color:var(--p1)}
.duel-name.side-p2{color:var(--p2)}
.duel-timer{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.6rem;text-align:center;width:100%}

.radar-wrap{position:relative;width:230px;height:230px;margin:18px auto 26px}
.radarRing{position:absolute;inset:0;border-radius:50%;border:2px solid var(--border)}
.radarPulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--p1);opacity:0;transform:scale(.6)}
.radarPulse.active{animation:pulseOut .6s ease-out}
@keyframes pulseOut{0%{opacity:.8;transform:scale(.5)}100%{opacity:0;transform:scale(1.15)}}
.radarCore{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,var(--p1) 0%,var(--p2) 100%);box-shadow:0 0 30px var(--glow-p1);transition:transform .15s}
.radarCore.pop{transform:scale(1.15)}
.bpm-readout{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}

.zone-bar{width:100%;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-bottom:6px}
.zone-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--p2));transition:width .4s}
.zone-label{font-family:'Rajdhani',sans-serif;font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:16px}

.nudge-row{display:flex;gap:10px;width:100%;margin-bottom:10px}
.nudge-btn{flex:1;padding:14px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nudge-btn .n-icon{font-size:1.3rem}
.nudge-btn.push{border-color:rgba(220,38,38,.4)}
.nudge-btn.ease{border-color:rgba(52,211,153,.4)}
.nudge-hint{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.4}

.action-row{display:flex;gap:10px;width:100%;margin-top:8px}
.btn-edge{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#1a1116}
.btn-over{background:var(--surface2);border:1px solid var(--p2);color:var(--p2)}
.btn-bank{background:linear-gradient(135deg,var(--green),#059669);color:#08231a}

.badge{display:flex;justify-content:center;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 14px;margin:0 auto 14px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.95rem;color:var(--gold);width:fit-content}

.countdown-ring{width:200px;height:200px;margin:16px auto;position:relative;display:flex;align-items:center;justify-content:center}
.countdown-ring svg{transform:rotate(-90deg)}
.countdown-ring .cd-num{position:absolute;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3rem;color:var(--gold)}
.countdown-label{text-align:center;font-family:'Rajdhani',sans-serif;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}

.result-hero{text-align:center;margin-bottom:20px}
.result-hero .r-winner{font-family:'Cinzel',serif;font-weight:900;font-size:1.5rem;background:linear-gradient(120deg,var(--p1),var(--gold),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.3}
.big-stat{text-align:center;margin-bottom:20px}
.big-stat .bs-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:2.6rem;color:var(--gold);line-height:1}
.big-stat .bs-lab{font-family:'Rajdhani',sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.substat{text-align:center;color:var(--muted);font-size:.95rem;margin-bottom:4px}

.compare-table{width:100%;border-collapse:collapse;margin-bottom:20px}
.compare-table th{font-family:'Rajdhani',sans-serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px;text-align:center;border-bottom:1px solid var(--border)}
.compare-table th.stat-label{text-align:left}
.compare-table th.th-p1{color:var(--p1)}
.compare-table th.th-p2{color:var(--p2)}
.compare-table td{padding:10px 6px;text-align:center;font-family:'Rajdhani',sans-serif;font-weight:600;border-bottom:1px solid var(--surface2);font-size:.98rem}
.compare-table td.stat-label{text-align:left;color:var(--muted);font-weight:500;font-size:.9rem}
.compare-table td.win{color:var(--gold);font-weight:700}
.compare-table td.win::after{content:' ✦'}

.share-box{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.share-box pre{font-family:'Rajdhani',sans-serif;font-size:.9rem;white-space:pre-wrap;word-break:break-word;line-height:1.5;user-select:all;-webkit-user-select:all}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--gold);color:var(--gold);padding:10px 20px;border-radius:20px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.err-msg{color:var(--p2);font-size:.88rem;margin:-8px 0 12px;min-height:1.2em}
</style>

<body>
<div id="toast" class="toast"></div>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════
   METRONOME BATTLE
   P1 plays -> gets ONE code -> shares it.
   P2 enters code -> plays the identical pattern -> sees the
   comparison and shares the result.
   ═══════════════════════════════════════════════════════════ */

/* Divider for Discord posts, so a battle stands out from surrounding chat. */
const RULE='━'.repeat(24);

/* Set this to wherever you host the game — it goes in the Discord share. */
const GAME_URL='https://curiouspirategames.github.io/metronomebattle/';

/* ---------- utils ---------- */
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function mkRng(seed){let s=(seed^0xdeadbeef)>>>0;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/0xffffffff;};}
function toB36(n,pad){let s=Math.max(0,Math.round(n)).toString(36).toUpperCase();while(s.length<pad)s='0'+s;return s;}
function fromB36(s){const v=parseInt(s,36);if(isNaN(v))throw new Error('bad');return v;}
function fmtTime(ms){const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}

/* ═══════════ PATTERN LIBRARY ═══════════
   Lifted from The Daily Edge / Metronome Edger. Each pattern is a
   shape — a run of blocks with its own character — not a single ramp.
   Rule kept from the originals: never end a pattern on a dip. */
function bpmc(v,lo,hi){return Math.round(clamp(v,lo,hi));}
function dur(centre,spread,r){return Math.max(4,Math.round(centre+(r()-0.5)*2*spread));}

const PATTERNS={
  // Calm, hypnotic. One gentle rise, holds.
  plateau(lo,hi,r){
    const mid=bpmc(lo+(hi-lo)*.4,lo,hi), top=bpmc(lo+(hi-lo)*.7,lo,hi);
    return [{bpm:lo,secs:dur(18,4,r)},{bpm:mid,secs:dur(20,4,r)},{bpm:top,secs:dur(16,3,r)}];
  },
  // Slow, fast, slow, faster. Ends fast.
  surge(lo,hi,r){
    const slow=bpmc(lo+(hi-lo)*.15,lo,hi), fast=bpmc(lo+(hi-lo)*.75,lo,hi), top=bpmc(lo+(hi-lo)*.95,lo,hi);
    return [{bpm:slow,secs:dur(16,4,r)},{bpm:fast,secs:dur(12,3,r)},
            {bpm:slow,secs:dur(13,3,r)},{bpm:top,secs:dur(14,3,r)}];
  },
  // Pure step-up. Never drops. Grinding.
  escalator(lo,hi,r){
    const a=bpmc(lo+(hi-lo)*.2,lo,hi),b=bpmc(lo+(hi-lo)*.45,lo,hi),
          c=bpmc(lo+(hi-lo)*.7,lo,hi),d=bpmc(lo+(hi-lo)*.95,lo,hi);
    return [{bpm:a,secs:dur(16,3,r)},{bpm:b,secs:dur(14,3,r)},
            {bpm:c,secs:dur(13,3,r)},{bpm:d,secs:dur(14,3,r)}];
  },
  // Fast, brief relief, then very fast. Snap.
  tease(lo,hi,r){
    const fast=bpmc(lo+(hi-lo)*.7,lo,hi), rest=bpmc(lo+(hi-lo)*.2,lo,hi), top=bpmc(hi,lo,hi);
    return [{bpm:fast,secs:dur(14,3,r)},{bpm:rest,secs:dur(8,2,r)},
            {bpm:top,secs:dur(15,3,r)}];
  },
  // True oscillation: up, down, up, down, up — each peak higher than the last,
  // each trough higher than the last. Six blocks so the shape is unmistakable.
  wave(lo,hi,r){
    const f=x=>bpmc(lo+(hi-lo)*x,lo,hi);
    return [{bpm:f(.28),secs:dur(20,4,r)},{bpm:f(.58),secs:dur(18,3,r)},
            {bpm:f(.38),secs:dur(17,3,r)},{bpm:f(.72),secs:dur(18,3,r)},
            {bpm:f(.50),secs:dur(16,3,r)},{bpm:f(.88),secs:dur(20,4,r)}];
  },
  // Normal, sudden sprint, back, harder sprint.
  punch(lo,hi,r){
    const mid=bpmc(lo+(hi-lo)*.4,lo,hi), sprint=bpmc(lo+(hi-lo)*.8,lo,hi), harder=bpmc(lo+(hi-lo)*.95,lo,hi);
    return [{bpm:mid,secs:dur(14,3,r)},{bpm:sprint,secs:dur(8,2,r)},
            {bpm:mid,secs:dur(11,2,r)},{bpm:harder,secs:dur(12,2,r)}];
  },
  // Genuinely long and low — roughly 90 seconds near the floor before one
  // sharp spike at the end. If this doesn't feel like a slow burn, nothing will.
  slowBurn(lo,hi,r){
    const crawl=bpmc(lo,lo,hi), creep=bpmc(lo+(hi-lo)*.12,lo,hi), spike=bpmc(lo+(hi-lo)*.90,lo,hi);
    return [{bpm:crawl,secs:dur(34,6,r)},{bpm:crawl,secs:dur(30,5,r)},
            {bpm:creep,secs:dur(28,5,r)},{bpm:spike,secs:dur(16,3,r)}];
  },
  // Rapid short alternations — vibrator flutter.
  flutter(lo,hi,r){
    const fast=bpmc(lo+(hi-lo)*.9,lo,hi), mid=bpmc(lo+(hi-lo)*.5,lo,hi);
    return [{bpm:fast,secs:dur(9,2,r)},{bpm:mid,secs:dur(8,2,r)},
            {bpm:fast,secs:dur(9,2,r)},{bpm:mid,secs:dur(7,2,r)},{bpm:fast,secs:dur(11,2,r)}];
  },
  // Builds to peak, small dip, returns to peak.
  climax(lo,hi,r){
    const mid=bpmc(lo+(hi-lo)*.5,lo,hi), peak=bpmc(hi,lo,hi), dip=bpmc(lo+(hi-lo)*.65,lo,hi);
    return [{bpm:lo,secs:dur(15,3,r)},{bpm:mid,secs:dur(14,3,r)},{bpm:peak,secs:dur(13,2,r)},
            {bpm:dip,secs:dur(10,2,r)},{bpm:peak,secs:dur(15,3,r)}];
  },
  // Long sustained middle before a final push. Cruel.
  grind(lo,hi,r){
    const mid=bpmc(lo+(hi-lo)*.55,lo,hi), high=bpmc(lo+(hi-lo)*.85,lo,hi);
    return [{bpm:lo,secs:dur(22,4,r)},{bpm:mid,secs:dur(28,5,r)},
            {bpm:high,secs:dur(18,3,r)},{bpm:high,secs:dur(14,3,r)}];
  }
};

/* Styles Player One can pick. Each one shifts three things: which patterns
   appear, where the speed band sits, and how long blocks run — so a Slow Burn
   really is slower and longer than a Relentless, not just differently named. */
const STYLES=[
  {id:'mixed',name:'Mixed',desc:'Draws from everything \u2014 least predictable.',
   pool:['plateau','wave','surge','grind','climax','punch','slowBurn','tease','escalator','flutter'],
   loMul:1,hiMul:1,durMul:1,opener:['plateau','wave','slowBurn']},
  {id:'waves',name:'Waves',desc:'Rises and falls, each peak a little higher than the last.',
   pool:['wave','wave','wave','plateau','climax','wave','grind'],
   loMul:1,hiMul:.90,durMul:1.15,opener:['wave','wave','plateau']},
  {id:'slowburn',name:'Slow Burn',desc:'Long stretches down low, then it hits late and hard.',
   pool:['slowBurn','slowBurn','slowBurn','plateau','slowBurn','grind'],
   loMul:.55,hiMul:.75,durMul:1.45,opener:['slowBurn','slowBurn','plateau']},
  {id:'surge',name:'Surge',desc:'Big swings between slow and fast, no settling.',
   pool:['surge','tease','punch','surge','flutter','tease'],
   loMul:.85,hiMul:1.05,durMul:.9,opener:['plateau','wave','surge']},
  {id:'relentless',name:'Relentless',desc:'Climbing almost throughout. Very little relief.',
   pool:['escalator','grind','escalator','punch','grind','climax'],
   loMul:1.35,hiMul:1.12,durMul:.95,opener:['plateau','escalator','grind']},
  {id:'erratic',name:'Erratic',desc:'Genuinely unpredictable block to block.',
   pool:['tease','flutter','punch','surge','climax','wave','escalator'],
   loMul:.9,hiMul:1.05,durMul:.8,opener:['plateau','wave','surge']}
];
const STYLE_IDS=STYLES.map(s=>s.id);

/* Chicken overrides the style — the shape IS the mode. Only non-dipping
   patterns, and the result is forced monotonic on top of that. */
const FORCED_STYLE={
  chicken:['escalator','grind','plateau','escalator','grind']
};

/* Build one pattern cycle.

   Build speed (0-9) controls how many cycles it takes to reach the top of the
   range: about 20 cycles (~20 min) at 0, about 6 (~6 min) at 9. It also sets
   how low the run starts, so a low build speed genuinely stays gentle for a
   long time rather than just arriving at the ceiling slightly later. */
/* Cycles needed to reach the top of the range, by build speed 0-9.
   At 9 it's on you in about 90 seconds; at 0 it takes the better part of
   half an hour. Build speed also shortens the blocks, so a fast build
   genuinely feels faster rather than just arriving sooner. */
const RAMP_CYCLES=[20,17,14,11,9,7,5.5,4,3,2.2];

function makeCycle(rng,cycleIdx,st,mode,styleId,prevPeak){
  const span=Math.max(10,st.maxBpm-st.minBpm);
  const inten=clamp(Math.round(st.intensity),0,9);
  const aggro=inten/9;
  const prog=clamp(cycleIdx/RAMP_CYCLES[inten],0,1);
  const style=STYLES.find(s=>s.id===styleId)||STYLES[0];

  let loF,hiF;
  if(mode==='chicken'){
    loF=(.00+.10*aggro)+(.45+.20*aggro)*prog;
    hiF=(.18+.25*aggro)+(.72-.15*aggro)*prog;
  }else{
    // High build speed starts higher AND climbs faster.
    loF=(.00+.08*aggro)+(.25+.20*aggro)*prog;
    hiF=(.18+.32*aggro)+(.78-.30*aggro)*prog;
  }
  // Style modifiers fade as the run goes on, so a style shapes the journey
  // rather than putting a permanent lid on it — a Slow Burn still gets there
  // in the end, it just takes its time.
  const useStyle=!FORCED_STYLE[mode];
  if(useStyle){
    const f=1-prog*.72;
    loF*=1+(style.loMul-1)*f;
    hiF*=1+(style.hiMul-1)*f;
  }
  loF=clamp(loF,0,.9); hiF=clamp(hiF,loF+.10,1);

  let lo=clamp(Math.round(st.minBpm+span*loF),20,215);
  let hi=clamp(Math.round(st.minBpm+span*hiF),lo+8,220);

  if(mode==='chicken'&&prevPeak){
    const step=Math.max(5,Math.round(span*(.04+.12*aggro)));
    lo=clamp(Math.max(lo,prevPeak),20,st.maxBpm);
    hi=clamp(Math.max(hi,prevPeak+step),lo+6,st.maxBpm);
  }

  let pool=FORCED_STYLE[mode]||style.pool;
  // Gentle opener only where there's time for one. At build speed 7+ the
  // whole point is that it's on you immediately, so skip it.
  if(cycleIdx===0&&inten<=6)pool=FORCED_STYLE[mode]?['plateau']:(style.opener||['plateau','wave','slowBurn']);

  const name=pool[Math.floor(rng()*pool.length)%pool.length];
  const blocks=PATTERNS[name](lo,hi,rng);
  const dm=(useStyle?style.durMul:1)*(1.30-.55*aggro);
  blocks.forEach(b=>{b.p=name;b.secs=Math.max(4,Math.round(b.secs*dm));});

  if(mode==='chicken'){
    let run=prevPeak||0;
    blocks.forEach(b=>{if(b.bpm<run)b.bpm=run;run=b.bpm;});
  }
  return blocks;
}

/* ---------- modes ---------- */
const MODES={
  longest:{code:'LE',title:'Longest Edge',tag:'Endurance',
    desc:'Same fixed pattern for both of you. Whoever holds out longest before edging wins.',
    goal:'Ride it out. Hit the button the moment you reach the edge.',
    how:'Play until you reach the edge, then log it. Longest time wins.'},
  fastest:{code:'FE',title:'Fastest Edge',tag:'Sprint',
    desc:'Same fixed pattern. First to reach the edge wins — chase it, don\'t resist it.',
    goal:'Get there as fast as you can. Log the moment you reach the edge.',
    how:'Race to your first edge. Fastest time wins.'},
  battle:{code:'EB',title:'Edge Battle',tag:'Set Time',
    desc:'A fixed time limit. Whoever racks up the most edges before the clock runs out wins.',
    goal:'Log every edge you reach before the clock runs out.',
    how:'Rack up as many edges as you can inside the time limit. Most edges wins.'},
  chicken:{code:'CH',title:'Chicken',tag:'Nerve',
    desc:'One ride, always climbing, no relief. Your time only counts if you bank it before you lose control.',
    goal:'It only gets harder. Bank your time before you go over — or score nothing.',
    how:'The pattern climbs and never eases off. Bank whenever you choose to keep your time. Go over and you score zero. Longest banked time wins.'},
  settrap:{code:'ST',title:'Set the Trap',tag:'Shaped',
    desc:'The one mode where you build the pattern as you ride it. Push harder or ease off — then they face exactly what you made.',
    goal:'Shape it as you ride it. Hold out longest to win.',
    how:'Player One shapes the pattern live. Player Two faces that exact run with no way to soften it. Longest hold wins.'},
  edgewithme:{code:'WM',title:'Edge With Me',tag:'Sync',
    desc:'Player One marks their edges. Player Two gets a countdown and has to land theirs at the same moment.',
    goal:'Mark each edge as you reach it.',
    how:'Player One sets the edges. Player Two gets a countdown and has to match the timing as closely as possible.'}
};
const BY_CODE=Object.fromEntries(Object.entries(MODES).map(([k,v])=>[v.code,k]));

/* ---------- bands (challengers never see the exact figure) ---------- */
const BANDS=[60,120,180,300,420,600,900,1200,1800,2700,3600,5400,7200];
function mins(s){const m=s/60;return m<60?m+' min':(m/60)+(m/60===1?' hour':' hours');}
function timeBand(ms){
  const s=Math.round(ms/1000);
  if(s<BANDS[0])return 'under a minute';
  for(let i=0;i<BANDS.length-1;i++) if(s<BANDS[i+1]) return 'somewhere between '+mins(BANDS[i])+' and '+mins(BANDS[i+1]);
  return 'over '+mins(BANDS[BANDS.length-1]);
}
function countBand(n){
  if(n<=0)return 'no edges';
  if(n<=2)return '1\u20132 edges';
  if(n<=4)return '3\u20134 edges';
  if(n<=7)return '5\u20137 edges';
  if(n<=11)return '8\u201311 edges';
  return '12+ edges';
}
/* Player Two is told nothing about Player One's score up front. Instead the
   game taps them on the shoulder once they've actually beaten it, so nobody
   grinds out 30 minutes to beat a 5-minute mark without knowing.

   The "you can stop now" margin scales down as the target grows: doubling a
   2-minute run is a fair ask, doubling a 20-minute run is not. */
function marginK(ms){
  const m=ms/60000;
  const pts=[[0,4.5],[1,4.0],[2,3.4],[4,2.8],[8,2.2],[15,1.8],[25,1.5],[40,1.32],[60,1.25]];
  if(m>=60)return 1.25;
  for(let i=0;i<pts.length-1;i++){
    const [m1,k1]=pts[i],[m2,k2]=pts[i+1];
    if(m<=m2)return k1+(k2-k1)*((m-m1)/(m2-m1));
  }
  return 1.25;
}
/* The moment Player Two actually passes Player One is never signalled — a
   regular would learn to read that as a readout and stop one second later
   every time. Instead the banner fires well past it, at a point rolled fresh
   with Math.random on every run, so the same code twice gives different
   timings and the crossing point can't be reverse-engineered. */
function rollAheadAt(p1ms){
  const jitter=0.88+Math.random()*0.24;          // 0.88 – 1.12
  const target=p1ms*marginK(p1ms)*jitter;
  return Math.min(target,p1ms+30*60000);          // never more than +30 min out
}
/* Modes where passing the target is a thing you can pass mid-run.
   Edge Battle is excluded — it runs the full clock regardless, so a banner
   would only leak their count. Chicken is excluded because knowing you're
   ahead kills the nerve. Fastest is excluded because passing means you lost. */
const NOTIFY_MODES=['longest','settrap'];
/* Modes with more than one edge, so they need a recovery break. */
const MULTI_EDGE=['battle','edgewithme'];
function setupLine(){
  const st=FORCED_STYLE[S.mode]?null:STYLES[S.settings.style];
  return S.settings.minBpm+'\u2013'+S.settings.maxBpm+' bpm'
    +(st?' \u00b7 '+st.name+' pattern':'')
    +(S.mode==='battle'?' \u00b7 '+S.settings.target+' min limit':'')
    +(MULTI_EDGE.includes(S.mode)?' \u00b7 '+(S.settings.brk?S.settings.brk+'s break':'no break'):'');
}

/* ---------- state ---------- */
let TOK=0;
const S={};
function reset(){
  TOK++;
  clearTimeout(S.timerID);clearInterval(S._ci);clearInterval(S._cd);clearTimeout(S._to);
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S,{
    screen:'home',role:null,mode:null,seed:null,
    settings:{minBpm:50,maxBpm:130,intensity:5,target:5,style:0,brk:30},
    p1Name:'',p2Name:'',code:'',
    audioCtx:null,nextNoteTime:0,lookahead:25,aheadTime:.12,
    timerID:null,running:false,
    curBlock:null,blockIdx:0,pausedTotal:0,breakStart:0,breakEndsAt:0,holdStart:0,finished:false,
    rng:null,queue:[],cycle:0,peak:0,blockEndsAt:0,blockRemain:null,
    liveBias:0,nudges:[],playedBlocks:[],
    playStart:0,edgeMarks:[],wentOver:false,banked:false,
    p1Result:null,p2Result:null,aheadState:null,aheadAt:0,
    ewmOffsets:[],ewmMatches:[],ewmIdx:0,ewmArmed:false,ewmTarget:0
  });
}
reset();
const app=document.getElementById('app');
function nav(s){S.screen=s;render();window.scrollTo(0,0);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
function esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

/* ---------- copy (works without HTTPS) ---------- */
function copyText(txt,label){
  let ok=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=txt;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    ok=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ok=false;}
  if(ok){toast(label+' copied');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(label+' copied'))
      .catch(()=>toast('Copy blocked — press and hold the text to copy'));
    return;
  }
  toast('Copy blocked — press and hold the text to copy');
}

/* ═══════════ CODE ═══════════ */
function packSettings(s){return toB36(s.minBpm,2)+toB36(s.maxBpm,2)+toB36(s.intensity,1)+toB36(s.target,2)+toB36(s.style,1)+toB36(s.brk||0,2);}
function unpackSettings(x){return{minBpm:fromB36(x.slice(0,2)),maxBpm:fromB36(x.slice(2,4)),
  intensity:fromB36(x.slice(4,5)),target:fromB36(x.slice(5,7)),style:fromB36(x.slice(7,8)),
  brk:x.length>=10?fromB36(x.slice(8,10)):0};}
function packNudges(n){return toB36(Math.min(20,n.length),1)+n.slice(0,20).map(([s,b])=>toB36(Math.min(46655,s),3)+toB36(b,1)).join('');}
function unpackNudges(x){const c=fromB36(x.slice(0,1));const o=[];let i=1;for(let k=0;k<c;k++){o.push([fromB36(x.slice(i,i+3)),fromB36(x.slice(i+3,i+4))]);i+=4;}return o;}
function packResult(r){
  let f=0; if(r.wentOver)f=1; else if(r.banked)f=2;
  let s=toB36(Math.round(r.totalMs/1000),3)+toB36(f,1)+toB36(Math.min(35,(r.edgeMarks||[]).length),1);
  (r.edgeMarks||[]).slice(0,35).forEach(ms=>s+=toB36(Math.round(ms/1000),3));
  return s;
}
function unpackResult(x){
  const totalMs=fromB36(x.slice(0,3))*1000, f=fromB36(x.slice(3,4)), n=fromB36(x.slice(4,5));
  const edgeMarks=[];let i=5;
  for(let k=0;k<n;k++){edgeMarks.push(fromB36(x.slice(i,i+3))*1000);i+=3;}
  return {totalMs,wentOver:f===1,banked:f===2,edgeMarks};
}
function buildCode(){
  return MODES[S.mode].code+'-'+toB36(S.seed,4)+'-'+packSettings(S.settings)
    +'-'+packNudges(S.nudges)+'-'+packResult(S.p1Result);
}
function parseCode(raw){
  const p=String(raw).trim().toUpperCase().replace(/\s+/g,'').split('-');
  const bad=()=>{throw new Error("That code doesn't look right — check it and try again.");};
  if(p.length!==5||!BY_CODE[p[0]])bad();
  try{
    const mode=BY_CODE[p[0]], seed=fromB36(p[1]), settings=unpackSettings(p[2]);
    const nudges=unpackNudges(p[3]), result=unpackResult(p[4]);
    if(!settings.maxBpm||settings.maxBpm<settings.minBpm)bad();
    if(settings.style>=STYLES.length)settings.style=0;
    return {mode,seed,settings,nudges,result};
  }catch(e){bad();}
}

/* ═══════════ AUDIO ═══════════ */
function ensureAudio(){
  if(!S.audioCtx)S.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(S.audioCtx.state==='suspended')S.audioCtx.resume();
}
function click(t){
  const c=S.audioCtx,o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.3,t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+.08);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.09);
}
function curBpm(){
  if(!S.curBlock)return S.settings.minBpm;
  return clamp(Math.round(S.curBlock.bpm*(1+S.liveBias*.14)),20,220);
}
function tick(){
  if(!S.running)return;
  const c=S.audioCtx;
  while(S.nextNoteTime<c.currentTime+S.aheadTime){
    click(S.nextNoteTime);
    const d=S.nextNoteTime-c.currentTime;
    setTimeout(pulse,Math.max(0,d*1000));
    S.nextNoteTime+=60/Math.max(20,curBpm());
  }
  S.timerID=setTimeout(tick,S.lookahead);
}
function pulse(){
  const r=document.getElementById('rPulse'),c=document.getElementById('rCore');
  if(r){r.classList.remove('active');void r.offsetWidth;r.classList.add('active');}
  if(c){c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),150);}
  const b=document.getElementById('bpmReadout');
  if(b)b.textContent=Math.round(curBpm())+' bpm';
}
/* Plays whole pattern cycles. P1's bias comes from live buttons (recorded
   against the cycle they'll affect); P2's comes from the recorded schedule,
   so the same seed reproduces the run exactly. */
/* ── Active time ──────────────────────────────────────────────
   Everything that matters is measured in ACTIVE pattern time, with
   breaks excluded. That's what keeps two players aligned: the pattern
   only advances while it's playing, so whenever each of them chooses to
   take their breaks, they hear the identical sequence and get exactly
   the same amount of edging time. */
function activeMs(){
  const inBreak=S.breakStart?(Date.now()-S.breakStart):0;
  const inHold=S.holdStart?(Date.now()-S.holdStart):0;
  return Math.max(0,Date.now()-S.playStart-S.pausedTotal-inBreak-inHold);
}
function activeSec(){return activeMs()/1000;}

/* ── Resumable pattern engine ─────────────────────────────────
   Blocks are pulled one at a time from a persistent cycle queue, so a
   break can pause mid-block and pick up with the exact remainder. */
function initEngine(){
  S.rng=mkRng(S.seed);S.queue=[];S.cycle=0;S.peak=0;
  S.curBlock=null;S.blockEndsAt=0;S.blockRemain=null;S.playedBlocks=[];
}
function pullBlock(){
  if(!S.queue.length){
    S.queue=makeCycle(S.rng,S.cycle,S.settings,S.mode,STYLE_IDS[S.settings.style],S.peak);
    S.queue.forEach(b=>{if(b.bpm>S.peak)S.peak=b.bpm;});
    S.cycle++;
  }
  return S.queue.shift();
}
function runBlocks(remainMs){
  const tok=++TOK;
  function step(rem){
    if(tok!==TOK||!S.running)return;
    if(rem==null){
      const b=pullBlock();
      S.curBlock=b;S.playedBlocks.push({bpm:b.bpm,secs:b.secs,p:b.p});
      rem=b.secs*1000;
    }
    S.blockEndsAt=Date.now()+rem;
    S._blockTO=setTimeout(()=>{if(tok===TOK&&S.running)step(null);},rem);
  }
  step(remainMs==null?null:remainMs);
}
function startMetro(){
  ensureAudio();
  initEngine();
  S.running=true;
  S.nextNoteTime=S.audioCtx.currentTime+.05;
  tick();runBlocks(null);
  scheduleNudgeReplay();
}
/* Player Two replays Player One's shaping, keyed to ACTIVE seconds so
   breaks don't knock it out of step. Re-armed after every break. */
function scheduleNudgeReplay(){
  (S._nudgeTOs||[]).forEach(clearTimeout);
  S._nudgeTOs=[];
  if(S.role!=='p2'||!S.nudges.length)return;
  const now=activeMs();
  S.nudges.forEach(([sec,b])=>{
    const d=sec*1000-now;
    if(d<=0){S.liveBias=b-3;return;}
    S._nudgeTOs.push(setTimeout(()=>{
      if(!S.running)return;
      S.liveBias=b-3;
      if(S.mode==='settrap')render();
    },d));
  });
}
function pauseMetro(){
  if(!S.running)return;
  S.blockRemain=Math.max(0,S.blockEndsAt-Date.now());
  S.running=false;TOK++;
  clearTimeout(S.timerID);clearTimeout(S._blockTO);
  (S._nudgeTOs||[]).forEach(clearTimeout);S._nudgeTOs=[];
}
function resumeMetro(){
  ensureAudio();
  S.running=true;
  S.nextNoteTime=S.audioCtx.currentTime+.05;
  tick();runBlocks(S.blockRemain);
  S.blockRemain=null;
  scheduleNudgeReplay();
}
function stopMetro(){
  S.running=false;TOK++;
  clearTimeout(S.timerID);clearTimeout(S._blockTO);
  (S._nudgeTOs||[]).forEach(clearTimeout);S._nudgeTOs=[];
}

/* ── Breaks ───────────────────────────────────────────────────
   The break length is set by Player One and carried in the code, so both
   players get the same recovery. It pauses the pattern and the clock. */
function breakSecs(){return S.settings.brk||0;}
function startBreak(){
  if(!breakSecs()){afterBreak();return;}
  pauseMetro();
  S.breakStart=Date.now();
  S.breakEndsAt=Date.now()+breakSecs()*1000;
  render();
}
function endBreak(){
  if(!S.breakStart)return;
  S.pausedTotal+=Date.now()-S.breakStart;
  S.breakStart=0;S.breakEndsAt=0;
  afterBreak();
}
function afterBreak(){
  if(S.finished)return;
  if(!S.running)resumeMetro();
  render();
}
function skipBreak(){endBreak();}

/* ═══════════ ROUTER ═══════════ */
function render(){
  const f={home:vHome,role:vRole,setup:vSetup,play:vPlay,p1done:vP1Done,
    enter:vEnter,ready:vReady,ewmPlay:vEwmPlay,compare:vCompare}[S.screen];
  if(f)f();
}

function vHome(){
  app.innerHTML=`<div class="screen active"><div class="wrap">
    <div class="page-title">METRONOME<br>BATTLE</div>

/* Watches for Player Two passing Player One, in the modes where that's a

function checkAhead(){
  if(S.role!=='p2'||!S.p1Result||S.aheadState)return;
  if(!NOTIFY_MODES.includes(S.mode))return;
  if(S.p1Result.wentOver)return;        // they went over; finishing clean beats them
  if(!S.aheadAt)return;
  if(activeMs()>=S.aheadAt){

}

function nudge(d){
  const next=clamp(S.liveBias+d,-3,3);
  if(next===S.liveBias){toast(d>0?'Already at the hardest setting':'Already at the gentlest setting');return;}
  S.liveBias=next;
  const sec=Math.round(activeSec());
  // Only the final level for any given second is kept — rapid taps collapse to
  // one entry, which keeps the code short and the replay unambiguous.
  const last=S.nudges[S.nudges.length-1];
  if(last&&last[0]===sec)last[1]=next+3;
  else if(S.nudges.length<20)S.nudges.push([sec,next+3]);
  else toast('That\u2019s as many changes as the code can carry');
  render();
}

  S.edgeMarks.push(activeMs());

    toast('Edge '+S.edgeMarks.length+' logged');
    startBreak();return;

  if(S.mode==='edgewithme'){
    toast('Edge '+S.edgeMarks.length+' recorded');
    if(S.edgeMarks.length>=S.settings.target){finish('stop');return;}
    startBreak();return;
  }
  finish('edged');
}

}

    wentOver:how==='over',banked:how==='bank'};

  else{S.p2Result=r;nav('compare');}
}

/* ---------- Edge With Me (P2) ---------- */
/* Edge With Me runs entirely on ACTIVE pattern time and is driven by the
   clock poll rather than timers, so a break can't knock it out of step.

   The break begins at Player One's recorded edge point, NOT when the
   challenger presses. If it started on their press, a late press would
   leave them further into the pattern than Player One was, and that drift
   would compound across every edge. Late presses are caught during the
   break instead, which doubles as the grace window. */
/* ── Edge With Me, challenger side ─────────────────────────────

   The metronome NEVER goes silent while they're trying to reach an edge.
   Three states:

     COUNTDOWN  ten seconds out, ring appears, pattern plays as normal
     HOLD       the mark arrives and they haven't logged yet: the pattern
                stops ADVANCING but keeps clicking at its current speed,
                holding them right there until they log it
     BREAK      logged, so the metronome stops and the rest timer runs

   Freezing pattern advancement (rather than the sound) during HOLD is what
   keeps both players aligned: however long the challenger takes to get
   there, they resume from the same point in the pattern Player One did, so
   no drift builds up across edges. */
function armNextEwm(){ /* driven by pollEwm */ }
function holdSecs(){return S.holdStart?(Date.now()-S.holdStart)/1000:0;}
const EWM_LEAD=10;      // countdown length
const EWM_GRACE=25;     // how long HOLD waits before calling it a miss

function pollEwm(){
  if(S.mode!=='edgewithme'||S.role!=='p2'||S.finished)return;
  if(S.breakStart)return;                       // generic break timer handles it
  if(S.ewmIdx>=S.ewmOffsets.length)return;
  const t=S.ewmOffsets[S.ewmIdx];

  if(S.holdStart){
    if(holdSecs()>=EWM_GRACE){recEwm(true);edgeDone();}
    return;
  }
  const a=activeSec();
  if(!S.ewmArmed&&a>=t-EWM_LEAD){S.ewmArmed=true;S.ewmTarget=t;S.ewmPressed=false;render();return;}
  if(S.ewmArmed&&a>=t){startHold();render();}    // hold them here until they log it
}
/* Stop the pattern moving forward but keep the clicks going. */
function startHold(){
  if(S.holdStart)return;
  S.blockRemain=Math.max(0,S.blockEndsAt-Date.now());
  clearTimeout(S._blockTO);
  S.holdStart=Date.now();
}
/* Everything that happens once an edge is settled, pressed or missed. */
function edgeDone(){
  if(S.holdStart){
    S.pausedTotal+=Date.now()-S.holdStart;S.holdStart=0;
    S.running=false;TOK++;clearTimeout(S.timerID);
    (S._nudgeTOs||[]).forEach(clearTimeout);S._nudgeTOs=[];
  } else pauseMetro();
  S.ewmIdx++;S.ewmArmed=false;S.ewmPressed=false;
  if(S.ewmIdx>=S.ewmOffsets.length){finishEwm(false);return;}
  if(breakSecs()){
    S.breakStart=Date.now();S.breakEndsAt=Date.now()+breakSecs()*1000;
    render();
  } else {resumeMetro();render();}
}
function paintCd(){
  const cc=document.getElementById('cdC'),n=document.getElementById('cdN');
  if(!cc||!n)return;
  if(S.holdStart){
    cc.setAttribute('stroke-dashoffset','0');
    n.textContent='+'+holdSecs().toFixed(0);
    n.style.color='var(--p2)';
    return;
  }
  const rem=S.ewmTarget-activeSec();
  cc.setAttribute('stroke-dashoffset',String(553*(1-clamp(rem/EWM_LEAD,0,1))));
  n.textContent=rem>0?Math.ceil(rem):'0';
  n.style.color=rem<=3?'var(--p2)':'var(--gold)';
}
/* Accuracy against Player One's mark: negative early, positive late. */
function recEwm(missed){
  let d;
  const tgt=S.ewmOffsets[S.ewmIdx];
  if(missed)d=EWM_GRACE;
  else if(S.holdStart)d=holdSecs();
  else d=activeSec()-tgt;
  S.ewmMatches.push(d);
  toast(missed?'Missed that one':((d>=0?'+':'')+d.toFixed(1)+'s'));
}
/* Logging is available whenever they actually reach the edge, ring or no ring
   — otherwise someone who gets there early has nothing to press, and ends up
   either enduring it or logging a time they didn't really hit.

   Logging early jumps the pattern forward to Player One's mark before the
   break, so an early edge can't leave them sitting further back in the
   pattern than Player One was. The miss is already paid for in the score. */
function pressEwm(){
  if(S.ewmPressed||S.breakStart||S.finished)return;
  if(S.ewmIdx>=S.ewmOffsets.length)return;
  S.ewmTarget=S.ewmOffsets[S.ewmIdx];
  recEwm(false);
  S.ewmPressed=true;
  if(!S.holdStart)fastForwardTo(S.ewmTarget);
  edgeDone();
}
/* Silently advance the pattern to a later point, used after an early log.
   Consumes blocks without playing them and nudges the active clock to match,
   so both players resume from the same place. */
function fastForwardTo(targetSec){
  let need=targetSec*1000-activeMs();
  if(need<=0)return;
  if(S.blockRemain==null)S.blockRemain=Math.max(0,S.blockEndsAt-Date.now());
  let guard=0;
  while(need>0&&guard++<500){
    if(S.blockRemain>need){S.blockRemain-=need;need=0;break;}
    need-=S.blockRemain;
    const b=pullBlock();
    S.curBlock=b;S.playedBlocks.push({bpm:b.bpm,secs:b.secs,p:b.p});
    S.blockRemain=b.secs*1000;
  }
  S.pausedTotal-=targetSec*1000-activeMs();
}
function vEwmPlay(){
  const armed=S.ewmArmed,hold=!!S.holdStart,brk=!!S.breakStart;
  const radar=`<div class="radar-wrap"><div class="radarRing"></div><div class="radarPulse" id="rPulse"></div>
      <div class="radarCore" id="rCore"></div><div class="bpm-readout" id="bpmReadout">— bpm</div></div>`;

  let top='',body='',btn='';
  if(brk){
    body=breakPanel();
  }else{
    if(armed||hold){
      top=`<div class="cd-strip ${hold?'hold':''}">
        <svg width="86" height="86" viewBox="0 0 200 200" class="cd-mini">
          <circle cx="100" cy="100" r="88" fill="none" stroke="#3a2530" stroke-width="14"/>
          <circle id="cdC" cx="100" cy="100" r="88" fill="none" stroke="url(#gg)" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553"/>
          <defs><linearGradient id="gg"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#dc2626"/></linearGradient></defs>
        </svg>
        <div class="cd-side">
          <div class="cd-num" id="cdN">${EWM_LEAD}</div>
          <div class="cd-cap">${hold?'Their mark — log it when you get there':'Their mark is coming'}</div>
        </div></div>`;
    }
    body=radar;
    if(hold)body+=`<div class="hold-note">Holding you here at this speed until you log it.</div>`;
    if(!armed&&!hold)body+=`<div class="nudge-hint">Building. The ring appears ten seconds before their next mark \u2014 but if you get there first, log it anyway.</div>`;
    btn=`<button class="btn btn-edge" onclick="pressEwm()">Edged Now</button>`;
  }

  app.innerHTML=`<div class="screen active"><div class="wrap">
    <div class="duel-header"><div class="duel-name side-p2">${esc(S.p2Name)}</div>
    <div class="duel-name" style="color:var(--muted);font-size:.85rem">Edge With Me</div></div>
    <div class="duel-timer" id="clk">0:00</div>
    <div class="badge">${S.ewmIdx} of ${S.ewmOffsets.length} matched</div>
    ${top}${body}${btn}
    <button class="btn btn-over" style="margin-top:10px" onclick="finishEwm(true)">I Went Over</button>
    <button class="btn btn-ghost btn-sm" onclick="askAbandon()">Abandon (no result)</button>
  </div></div>`;
  paintClock();
  if(armed||hold)paintCd();
}
function finishEwm(over){
  stopMetro();clearInterval(S._ci);clearInterval(S._cd);clearTimeout(S._to);
  S.p2Result={totalMs:activeMs(),edgeMarks:[],wentOver:over,banked:false,matches:S.ewmMatches.slice()};
  nav('compare');
}

/* ═══════════ COMPARE ═══════════ */
function winner(){
  const a=S.p1Result,b=S.p2Result;
  if(!a||!b)return null;
  // Compare at the precision actually displayed (whole seconds), so two runs
  // shown as the same time never produce a winner.
  const sec=r=>Math.round(r.totalMs/1000);
  switch(S.mode){
    case 'fastest':{
      const av=a.wentOver?Infinity:sec(a),bv=b.wentOver?Infinity:sec(b);
      return av===bv?'tie':(av<bv?'p1':'p2');}
    case 'battle':
      return a.edgeMarks.length===b.edgeMarks.length?'tie':(a.edgeMarks.length>b.edgeMarks.length?'p1':'p2');
    case 'chicken':{
      const av=a.wentOver?0:sec(a),bv=b.wentOver?0:sec(b);
      return av===bv?'tie':(av>bv?'p1':'p2');}
    case 'edgewithme':return 'sync';
    default:{
      if(a.wentOver!==b.wentOver)return a.wentOver?'p2':'p1';
      return sec(a)===sec(b)?'tie':(sec(a)>sec(b)?'p1':'p2');}
  }
}
function syncGrade(avg){
  if(avg<1)return 'Uncanny';
  if(avg<2.5)return 'Locked in';
  if(avg<5)return 'Close enough';
  if(avg<10)return 'Loose';
  return 'Miles off';
}
function row(l,v1,v2,w){return `<tr><td class="stat-label">${l}</td><td class="${w==='p1'?'win':''}">${v1}</td><td class="${w==='p2'?'win':''}">${v2}</td></tr>`;}
function vCompare(){
  const a=S.p1Result,b=S.p2Result,w=winner();
  let head,rows='';
  if(S.mode==='edgewithme'){
    const ms=b.matches||[];
    const avg=ms.length?ms.reduce((x,y)=>x+Math.abs(y),0)/ms.length:0;
    head=esc(S.p2Name)+' — '+syncGrade(avg);
    rows+=row('Edges matched',a.edgeMarks.length,ms.length,null);
    rows+=row('Average gap','—',avg.toFixed(1)+'s',null);
    ms.forEach((d,i)=>{rows+=row('Edge '+(i+1),fmtTime(a.edgeMarks[i]||0),(d>=0?'+':'')+d.toFixed(1)+'s '+(d>=0?'late':'early'),null);});
  }else{
    head=w==='tie'?'Dead heat':(w==='p1'?esc(S.p1Name):esc(S.p2Name))+' wins';
    if(S.mode==='battle'){
      rows+=row('Edges landed',a.edgeMarks.length,b.edgeMarks.length,w);
      rows+=row('Time used',fmtTime(a.totalMs),fmtTime(b.totalMs),null);
    }else if(S.mode==='chicken'){
      rows+=row('Banked',a.wentOver?'0:00':fmtTime(a.totalMs),b.wentOver?'0:00':fmtTime(b.totalMs),w);
      rows+=row('Went over?',a.wentOver?'Yes':'No',b.wentOver?'Yes':'No',null);
    }else{
      rows+=row(S.mode==='fastest'?'Time to edge':'Time held',
        fmtTime(a.totalMs),fmtTime(b.totalMs),w);
      rows+=row('Went over?',a.wentOver?'Yes':'No',b.wentOver?'Yes':'No',null);
      if(S.mode==='settrap')rows+=row('Pattern shaped by',esc(S.p1Name),'—',null);
    }
  }
  app.innerHTML=`<div class="screen active"><div class="wrap">
    <div class="result-hero"><div class="r-winner">${head}</div></div>
    <table class="compare-table"><thead><tr><th class="stat-label"></th>
      <th class="th-p1">${esc(S.p1Name)}</th><th class="th-p2">${esc(S.p2Name)}</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="share-box"><pre>${esc(resultText())}</pre></div>
    <button class="btn btn-primary" onclick="copyText(resultText(),'Result')">Copy Result for Discord</button>
    <button class="btn btn-ghost" onclick="abandon()">New battle</button>
  </div></div>`;
}
/* Discord result post */
function resultText(){
  const a=S.p1Result,b=S.p2Result,m=MODES[S.mode],w=winner();
  let t=RULE+'\n🎵 **METRONOME BATTLE** — '+m.title+'\n';
  if(S.mode==='edgewithme'){
    const ms=b.matches||[];
    const avg=ms.length?ms.reduce((x,y)=>x+Math.abs(y),0)/ms.length:0;
    t+='**'+S.p1Name+'** set '+a.edgeMarks.length+' edge'+(a.edgeMarks.length===1?'':'s')+'\n';
    t+='**'+S.p2Name+'** matched '+ms.length+' — avg '+avg.toFixed(1)+'s off\n';
    t+='\n🎯 **'+syncGrade(avg)+'**\n'+RULE;
    return t;
  }
  const line=(n,r)=>{
    if(S.mode==='battle')return '**'+n+'**: '+r.edgeMarks.length+' edge'+(r.edgeMarks.length===1?'':'s')+' in '+fmtTime(r.totalMs);
    if(S.mode==='chicken')return '**'+n+'**: '+(r.wentOver?'BUST — went over':fmtTime(r.totalMs)+' banked');
    return '**'+n+'**: '+fmtTime(r.totalMs)+(r.wentOver?' · went over':'');
  };
  t+=line(S.p1Name,a)+'\n'+line(S.p2Name,b)+'\n';
  t+='\n'+(w==='tie'?'🤝 **Dead heat**':'🏆 **'+(w==='p1'?S.p1Name:S.p2Name)+' wins**')+'\n'+RULE;
  return t;
}

render();
</script>
</body>
